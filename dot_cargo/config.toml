# Cargo global config (~/.cargo/config.toml). Applies to every workspace.
#
# Why this exists: the four big workspaces on this machine (tanzo, trading,
# tutero/frontend/library/modality, mosaic) all default to debug=2 + 600-1000
# transitive deps each, producing 100-200 GB `target/` dirs and slow inner
# loops. Settings here apply uniformly without editing each project's
# Cargo.toml; per-project Cargo.toml overrides still win where present.

# ---------------------------------------------------------------------------
# Outer parallelism
# ---------------------------------------------------------------------------
# Machine has 18 cores (6P + 12E). Default cargo `jobs = ncpus` plus any
# per-rustc parallel front-end (`-Z threads=N` set in nightly projects)
# can spawn 100+ contending threads. 14 outer jobs saturates the perf
# cores + half the efficiency cores while leaving headroom for the OS,
# tmux, browser, Claude sessions, etc.
[build]
jobs = 14

# ---------------------------------------------------------------------------
# Linker — Homebrew lld for Mach-O
# ---------------------------------------------------------------------------
# Apple ld-prime is fine for small bins but link time dominates incremental
# builds for big workspaces (modality's `modality-dev` pulls 600 crates into
# one debug binary). lld is dramatically faster on Mach-O link.
#
# Install: `brew install lld` (provides /opt/homebrew/opt/lld/bin/ld64.lld).
# Stable-compatible — no -Z flags here. Per-project .cargo/config.toml can
# ADD nightly flags to this array (cargo merges rustflags across config
# files at the same target level — doesn't replace).
[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld",
]

# ---------------------------------------------------------------------------
# Fast-dev profile
# ---------------------------------------------------------------------------
# debug = false:
#   No debug symbols in dev artifacts. Cuts dev build wall-clock 20-40% and
#   slashes target/debug/deps size. Trade-off: panic backtraces show raw
#   addresses, lldb is useless. When you need a debugger, build with
#   `cargo build --profile=debug-full`. Switch to debug = "line-tables-only"
#   if you want backtraces with file:line but no variable inspection.
#
# split-debuginfo = "unpacked":
#   macOS default; emits .dSYM bundles separately so linking doesn't pay the
#   debuginfo cost. Kept explicit so it survives future debug=true overrides.
#
# incremental = true:
#   Cargo's native incremental cache. The right inner-loop tool for local
#   dev. sccache was tried and reversed — it's a CI tool (cross-runner
#   artifact dedup); for one-machine dev it disables incremental in
#   exchange for cross-worktree dedup that's not worth the trade-off.
#
# [profile.dev.package."*"] opt-level = 0:
#   Both workspace crates AND deps stay at the default 0. We don't care
#   about runtime speed in dev — the user is iterating, not benchmarking.
#   Optimizing deps would buy faster test runs at the cost of slower
#   first-compile of each dep version. Not a trade we want.
#
# [profile.dev.build-override] opt-level = 3:
#   Proc-macros and build scripts run AT compile time — their "runtime"
#   IS your compile time. Compiling them once at opt=3 makes every
#   subsequent #[derive] expansion / build.rs invocation faster. Pure
#   compile-time win.
[profile.dev]
debug = false
split-debuginfo = "unpacked"
incremental = true

[profile.dev.package."*"]
opt-level = 0

[profile.dev.build-override]
opt-level = 3

# Opt-in profile for when a debugger is actually needed.
[profile.debug-full]
inherits = "dev"
debug = "full"

# ---------------------------------------------------------------------------
# Aliases — INTENTIONALLY EMPTY
# ---------------------------------------------------------------------------
# Don't try to add `test = "nextest run"` here. Cargo refuses to let user
# aliases shadow built-in commands (`test` is a built-in alias for the
# test runner) and silently ignores the entry with a warning. This is
# documented behavior, not a bug — rust-lang/cargo#10049.
#
# Use one of these instead:
#   - `ct` fish abbreviation (this dotfiles repo: dot_config/fish/config.fish)
#   - `j test` in projects with a justfile recipe
#   - `cargo nextest run` typed in full
# Nextest does not run doctests; use `cargo test --doc` (or `j test-docs`).
