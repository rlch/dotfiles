# herdr — agent multiplexer (tmux-for-AI-agents). Source of truth lives
# in dotfiles; chezmoi renders this to ~/.config/herdr/config.toml.
#
# Deployment: herdr runs STANDALONE inside a plain Ghostty window — it is
# NOT nested in cmux. cmux and herdr are competing multiplexers; this
# config exists so herdr can be A/B-compared against cmux with identical
# muscle memory. Every keybind below deliberately mirrors cmux
# (dot_config/cmux/cmux.json). The ⌘ chords only reach herdr because
# ~/.config/ghostty/config forwards them as CSI-u super sequences — see
# the "herdr ⌘-forwarding" block there; the two files are a matched pair.
#
# To edit: `chezmoi edit ~/.config/herdr/config.toml` → chezmoi apply.
# Live reload: `herdr server reload-config` (or `herdr --default-config`
# to dump the current default schema as a reference).

# Skip the first-run onboarding overlay — already gone through it.
onboarding = false

[theme]
# Inherit from the host terminal (Ghostty's Catppuccin Mocha palette).
# Picking the `terminal` theme means herdr follows whatever ghostty is
# set to — change Ghostty's theme later and herdr automatically tracks.
name = "terminal"

[terminal]
# New panes/tabs/workspaces inherit cwd from the focused pane — matches
# cmux's "new splits follow the focused pane" behavior.
new_cwd = "follow"

[keys]
# ── Keymap mirrors cmux (dot_config/cmux/cmux.json) ─────────────────────
# cmux drives everything with DIRECT chords (no prefix): ⌃ = focus, ⌘ =
# create/nav, ⌃1-9 / ⌘1-9 = jump, plus two sub-prefixes ⌃s (pane/layout)
# and ⌃q (workspace). herdr replicates the direct chords verbatim. The
# ⌃-chords arrive natively (kitty keyboard protocol); the ⌘-chords are
# forwarded by ghostty/config as CSI-u super sequences.
#
#   cmux              herdr             mechanism
#   ───────────────   ───────────────   ─────────────────────────────
#   ⌃ h/j/k/l  focus  ctrl+h/j/k/l      native (kitty protocol)
#   ⌃ 1-9  jump tab   ctrl+1..9         native   ([keys.indexed] tabs)
#   ⌘ H/L  prev/next tab   cmd+h/l      ghostty cmd-forward
#   ⌘ K/J  prev/next wksp  cmd+k/j      ghostty cmd-forward
#   ⌘ 1-9  jump wksp   cmd+1..9         ghostty cmd-forward (indexed)
#   ⌘T  new tab        cmd+t            ghostty cmd-forward
#   ⌘N  new workspace  cmd+n            ghostty cmd-forward
#   ⌘D / ⌘⇧D  split    cmd+d / cmd+shift+d
#   ⌘W  close tab      cmd+w
#   ⌘B  toggle sidebar cmd+b
#   ⌘P  wksp picker    cmd+p
#
# herdr keeps ONE prefix — set to ⌃s to mirror cmux's ⌃s pane sub-prefix,
# so ⌃s f (zoom) and ⌃s , (rename tab) are exact. cmux's SECOND sub-prefix
# ⌃q (workspace) has no herdr analogue (one prefix only), so close/rename
# workspace fold onto ⌃s with the same trailing keys (⌃s x / ⌃s ⇧,).
prefix = "ctrl+s"

# Panes — ⌃hjkl focus (cmux ⌃hjkl).
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# Splits — ⌘D right (vertical divider), ⌘⇧D down (cmux ⌘D / ⌘⇧D).
split_vertical   = "cmd+d"
split_horizontal = "cmd+shift+d"

# Tabs (= cmux "surfaces", the horizontal bar) — ⌘H/L cycle, ⌘T new,
# ⌘W close. Numeric jump is ⌃1-9 via [keys.indexed] below.
previous_tab = "cmd+h"
next_tab     = "cmd+l"
new_tab      = "cmd+t"
close_tab    = "cmd+w"

# Workspaces (= cmux sidebar entries) — ⌘K/J cycle, ⌘N new, ⌘P picker,
# ⌘B sidebar toggle. Numeric jump is ⌘1-9 via [keys.indexed] below.
previous_workspace = "cmd+k"
next_workspace     = "cmd+j"
new_workspace      = "cmd+n"
workspace_picker   = "cmd+p"
toggle_sidebar     = "cmd+b"

# ⌃s sub-prefix (mirrors cmux ⌃s …): zoom = ⌃s f, rename tab = ⌃s ,.
# cmux ⌃s = (equalize) has no one-shot herdr analogue → herdr's
# interactive resize mode on ⌃s r instead.
zoom        = "prefix+f"
rename_tab  = "prefix+comma"
resize_mode = "prefix+r"

# Workspace management — cmux uses ⌃q x / ⌃q , (its 2nd sub-prefix);
# folded onto the ⌃s prefix here with the same trailing keys.
close_workspace  = "prefix+x"
rename_workspace = "prefix+shift+comma"
# herdr has a per-pane close with no cmux equivalent (cmux ⌘W closes the
# whole tab). Parked off the ⌃s x used for close_workspace.
close_pane = "prefix+shift+x"

# Direct numeric jumps (cmux ⌃1-9 = surface/tab, ⌘1-9 = workspace).
# herdr's [keys.indexed] maps a bare modifier over 1..9.
[keys.indexed]
tabs       = "ctrl"   # ⌃1-9 → jump tab (cmux surfaces)
workspaces = "cmd"    # ⌘1-9 → jump workspace

[ui]
# Named color so the accent follows the terminal palette in lock-step
# with the `terminal` theme above — no hex lock-in. Ghostty's `blue`
# slot is Catppuccin Mocha blue today; change ghostty's theme and this
# tracks without a config edit.
accent = "blue"

# Show all detected agent rows in the sidebar (not just the focused
# workspace's) — useful when multiple workspaces have active agents.
agent_panel_scope = "all"

# Standalone in Ghostty, herdr IS the multiplexer — so it owns the mouse
# for its own UI (splits, sidebar, tab bar), exactly as cmux does. Ghostty
# is a passive host here, so there is no outer layer to defer to.
mouse_capture = true

# Show the per-pane agent label (claude/codex/hermes) in the pane border.
# Cheap visual cue to know which agent owns the focused split without
# checking the sidebar.
show_agent_labels_on_pane_borders = true

[ui.toast]
# In-app toasts only. Routing to the OS would be a no-op anyway —
# ghostty has `desktop-notifications = false` — so keep herdr's
# notifications inside herdr.
delivery = "herdr"

[ui.sound]
# Audible cue when an agent in a background workspace changes state. Useful
# when juggling multiple agents whose sidebar badges aren't in view.
enabled = true

[worktrees]
# Sibling of the git worktrees the user already keeps under ~/. Default is
# fine; pinned explicitly so it's discoverable.
directory = "~/.herdr/worktrees"

[experimental]
# Nested herdr (herdr inside a herdr-managed pane) would be confusing —
# leave it off.
allow_nested = false
