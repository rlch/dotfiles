# herdr — agent multiplexer (tmux-for-AI-agents). Source of truth lives
# in dotfiles; chezmoi renders this to ~/.config/herdr/config.toml.
#
# Deployment: herdr runs STANDALONE inside a plain Ghostty window and is the
# daily-driver multiplexer (cmux, the previous one, has been removed). The
# keymap below is the vim-modal layout carried over from cmux so muscle memory
# transferred — it's now herdr's own, edited only here. The ⌘ chords only reach
# herdr because ~/.config/ghostty/config forwards them as CSI-u super sequences
# — see the "herdr ⌘-forwarding" block there; the two files are a matched pair.
#
# To edit: `chezmoi edit ~/.config/herdr/config.toml` → chezmoi apply.
# Live reload: `herdr server reload-config` (or `herdr --default-config`
# to dump the current default schema as a reference).

# Skip the first-run onboarding overlay — already gone through it.
onboarding = false

[theme]
# Tokyo Night for herdr's own chrome — higher contrast than Catppuccin,
# whose pastel-on-pastel pane borders + selected-workspace highlight washed
# out. Still a blue/purple palette so it harmonizes with Ghostty's
# Catppuccin Mocha terminal CONTENT (unaffected — this themes only herdr's
# UI chrome). accent stays mauve (#cba6f7) — light on TN's dark bg, so the
# focused border / selection reads clearly.
name = "tokyo-night"

# Override specific chrome tokens with Catppuccin Mocha colors so herdr's UI
# lines up with the terminal palette. Token names from herdr's source
# (CustomThemeColors → Palette), with what each ACTUALLY paints:
#   panel_bg    = tab-bar + panel bg (accepts "transparent" → Color::Reset)
#   surface0    = selected/focused item bg  AND  inactive-tab bg
#   surface_dim = pane border / separators  (+ active-tab fg fallback)
#   accent      = active-tab bg + focused-pane border  (mauve, set in [ui])
[theme.custom]
# Tab bar + panels = TRANSPARENT: the outer terminal background shows through
# — including Ghostty's macos-glass blur — so the tab strip matches the
# terminal exactly and tracks it. (herdr maps "transparent"/"none"/"reset" →
# Color::Reset.) Caveat: a *custom-named active* tab's text falls back to
# surface_dim on the mauve accent; swap to a solid "#1e1e2e" if it reads poorly.
panel_bg = "transparent"
# surface0 paints BOTH the selected-workspace highlight AND the inactive-tab
# background, so keep it a SOFT selection tint — Catppuccin Surface0 (#313244),
# one gentle step above Base. (Surface1 #45475a was too harsh: it made the
# selection and the inactive tabs both look heavy/ugly.)
surface0 = "#313244"
# Pane border / split divider = Catppuccin Surface2 (#585b70) — lighter than
# Base so dividers read. Focused pane + active tab use the mauve accent above.
surface_dim = "#585b70"

[terminal]
# New panes/tabs/workspaces inherit cwd from the focused pane.
new_cwd = "follow"

[keys]
# ── Keymap: vim-modal, direct chords (carried over from cmux, now removed) ─
# Everything drives off DIRECT chords (no leader): ⌃ = focus, ⌘ = create/nav,
# ⌃1-9 / ⌘1-9 = jump, plus ONE sub-prefix ⌃s (pane/layout + workspace ops).
# The ⌃-chords arrive natively (kitty keyboard protocol); the ⌘-chords are
# forwarded by ghostty/config as CSI-u super sequences.
#
#   chord              herdr key         mechanism
#   ───────────────    ───────────────   ─────────────────────────────
#   ⌃ h/j/k/l  focus   ctrl+h/j/k/l      native (kitty protocol)
#   ⌃ 1-9  jump tab    ctrl+1..9         native   ([keys.indexed] tabs)
#   ⌘ H/L  prev/next tab    cmd+h/l      ghostty cmd-forward
#   ⌘ K/J  prev/next wksp   cmd+k/j      ghostty cmd-forward
#   ⌘ 1-9  jump wksp   cmd+1..9          ghostty cmd-forward (indexed)
#   ⌘T  new tab        cmd+t             ghostty cmd-forward
#   ⌘N  new workspace  cmd+n             ghostty cmd-forward
#   ⌘D / ⌘⇧D  split    cmd+d / cmd+shift+d
#   ⌘W  close pane     cmd+w
#   ⌘B  toggle sidebar cmd+b
#   ⌘P  wksp picker    cmd+p
#   ⌘E  resize mode    cmd+e             ghostty cmd-forward
#   ⌃⌥hjkl move pane   ctrl+alt+hjkl     ghostty ⌃⌥-forward
#   ⌘[ / ⌘]  agent nav cmd+[ / cmd+]     ghostty cmd-forward (prev/next agent)
#
# ONE sub-prefix, ⌃s (pane/layout): ⌃s f (zoom), ⌃s , (rename tab) etc.
# Workspace ops fold onto the same ⌃s prefix (⌃s x close, ⌃s ⇧w rename) —
# there is no second leader key.
prefix = "ctrl+s"

# Panes — ⌃hjkl focus.
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# Copy / scroll mode on ⌃\. If herdr rejects the backslash key name (watch
# the reload diagnostics), fall back to the herdr default ⌃s [ (prefix+bracket_left).
copy_mode = "ctrl+backslash"

# Splits — ⌘D right (vertical divider), ⌘⇧D down.
split_vertical   = "cmd+d"
split_horizontal = "cmd+shift+d"

# Tabs (the horizontal bar) — ⌘H/L cycle, ⌘T new. ⌘W closes the focused PANE
# (see close_pane), so tab-close moved to ⌃s ⇧x. Numeric jump is ⌃1-9 via
# [keys.indexed] below.
previous_tab = "cmd+h"
next_tab     = "cmd+l"
new_tab      = "cmd+t"
close_tab    = "prefix+shift+x"

# Workspaces (sidebar entries) — ⌘K/J cycle, ⌘N new, ⌘P picker,
# ⌘B sidebar toggle. Numeric jump is ⌘1-9 via [keys.indexed] below.
previous_workspace = "cmd+k"
next_workspace     = "cmd+j"
new_workspace      = "cmd+n"
workspace_picker   = "cmd+p"
toggle_sidebar     = "cmd+b"

# Agents — ⌘[ / ⌘] focus previous / next agent (up/down the agent list),
# forwarded by ghostty as csi:91;9u / csi:93;9u (⌘ never reaches a TUI
# natively). NB: the first attempt "didn't switch properly" because the
# ghostty forward line carried a TRAILING # comment — ghostty appends that to
# the value, so ⌘[ sent the CSI-u PLUS the comment text as keystrokes. Fixed
# by keeping ghostty annotations ABOVE their binds. ⌘⇧jk/⌘⇧hl ("move agents"/
# "move tabs") stay unbound: herdr has no reorder for agents/tabs (no CLI).
previous_agent = "cmd+["
next_agent     = "cmd+]"

# ⌃s sub-prefix: zoom = ⌃s f, rename tab = ⌃s ,. There is no equalize action
# (no keybind, no CLI), so the Karabiner Left-Option-tap gesture does ONLY the
# ⌥→zoom half; the Shift+⌥→equalize half is deliberately dropped. herdr's
# interactive resize mode is on ⌘E instead (ghostty forwards it as csi:101;9u) —
# ⌃s r freed.
zoom        = "prefix+f"
rename_tab  = "prefix+comma"
resize_mode = "cmd+e"

# Workspace management folds onto the ⌃s prefix (herdr has one prefix).
# close is ⌃s x. rename is ⌃s ⇧W
# (W = workspace, herdr's own default): herdr warns punctuation-with-modifiers
# is terminal-dependent, and ⌃s ⇧, (prefix+shift+comma) genuinely never fired —
# the shifted comma arrives as `<` and misses the match, while herdr accepts the
# string on reload (no diagnostic), so it fails silently. Letter chords are
# herdr's "most reliable" tier, so rename uses ⇧W, not shifted punctuation.
close_workspace  = "prefix+x"
rename_workspace = "prefix+shift+w"
# ⌘W closes the focused PANE (pane-granular, per request — not the whole
# tab or workspace). close_tab is on ⌃s ⇧x, close_workspace on ⌃s x.
close_pane = "cmd+w"

# Session & scrollback — native ⌃s prefix chords (no ghostty forward needed):
#   ⌃s ⇧r  reload config.toml from inside herdr (vs the `herdr server
#          reload-config` CLI) · ⌃s q  detach, leaving agents running ·
#   ⌃s e   dump the focused pane's scrollback into $EDITOR.
reload_config   = "prefix+shift+r"
detach          = "prefix+q"
edit_scrollback = "prefix+e"

# Git worktrees — herdr's [worktrees] integration (dir set in [worktrees]
# below). g-cluster on the prefix: ⌃s ⇧g new · ⌃s g open/switch · ⌃s ⌃g
# remove (opens a confirmation first).
new_worktree    = "prefix+shift+g"
open_worktree   = "prefix+g"
remove_worktree = "prefix+ctrl+g"

# Direct numeric jumps: ⌃1-9 = tab, ⌘1-9 = workspace.
# herdr's [keys.indexed] maps a bare modifier over 1..9.
[keys.indexed]
tabs       = "ctrl"   # ⌃1-9 → jump tab
workspaces = "cmd"    # ⌘1-9 → jump workspace

# Direct pane MOVE (swap with neighbor) on ⌃⌥hjkl — reposition the focused
# pane within the layout. herdr has no native swap keybind action (only the
# `herdr pane swap` CLI), so these shell out just like the old resize binds.
# ⌃⇧hjkl (former direct-resize) is now UNBOUND — resizing lives in the
# interactive resize mode on ⌘E. ⌃⌥hjkl are ghostty-forwarded as csi:NNN;7u
# (modifier 7 = ctrl+alt) because Option isn't Alt here (macos-option-as-alt
# is unset), so they can't arrive natively the way the ctrl+shift binds did.
#
# NB: the requested ⌘⇧hjkl "move tab / move workspace" is deliberately
# absent — herdr has no reorder action or CLI for tabs/workspaces (only
# panes can be swapped/moved), which is exactly what ⌃⌥hjkl now do.
[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
command = "herdr pane swap --direction left --current"
description = "move pane left"

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
command = "herdr pane swap --direction right --current"
description = "move pane right"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "herdr pane swap --direction up --current"
description = "move pane up"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = "herdr pane swap --direction down --current"
description = "move pane down"

[ui]
# Accent for highlights, borders, and navigation UI — Catppuccin Mocha
# Mauve (#cba6f7). Hex-pinned because "mauve" isn't one of herdr's named
# colors (only cyan/blue/magenta).
accent = "#cba6f7"

# Agent panel ordering: "priority" floats agents that are blocked / awaiting
# input to the top (attention queue) rather than "spaces" (grouped by
# workspace). Replaces the old agent_panel_scope="all" — that key does not
# exist in herdr, so it was a silent no-op AND forced a config-rewrite drift.
agent_panel_sort = "priority"

# Terminal width at or below which herdr uses the single-column MOBILE layout
# (the one with the top-right view-switch button). herdr's default is 64.
# Raised to 72 because the Termius client on the phone reports 70x30 — it used
# to report 58x25 and sat comfortably under the default, then on 2026-07-29
# ~08:26 it jumped to 70 cols (font/appearance change on the phone) and
# silently fell out of mobile mode. Nothing about herdr changed; 0.7.5 was
# already installed on 07-25 and mobile mode worked fine until that resize.
# 72 is deliberately tight: the local Ghostty client only lands in the 65-72
# band if the font is zoomed hard, so this doesn't drag the desktop into the
# mobile layout. If the phone's font shrinks again, re-check the reported cols
# in herdr-server.log ("client connected ... cols=N", cell_width_px=8 marks the
# remote/Termius client) rather than guessing a bigger number.
mobile_width_threshold = 72

# Create new tabs instantly with generated names instead of prompting for a
# name each time.
prompt_new_tab_name = false

# Standalone in Ghostty, herdr IS the multiplexer — so it owns the mouse
# for its own UI (splits, sidebar, tab bar). Ghostty is a passive host here,
# so there is no outer layer to defer to.
mouse_capture = true

# Draw borders around split panes (herdr default) — the divider line reads
# better than fully borderless once gaps are off.
pane_borders = true

# Panes share divider borders instead of a compact gap between them —
# denser look, and the pane border (surface_dim #585b70 above) renders as a
# solid line rather than empty space.
pane_gaps = false

# Keep the per-pane agent label (claude/codex/hermes) OUT of the pane
# border — the border stays a clean divider with no title text. The
# sidebar/agent panel already shows which agent owns each split, so the
# in-border label was redundant chrome.
show_agent_labels_on_pane_borders = false

[ui.toast]
# In-app toasts only. Routing to the OS would be a no-op anyway —
# ghostty has `desktop-notifications = false` — so keep herdr's
# notifications inside herdr.
delivery = "herdr"

[ui.sound]
# Audible cue when an agent in a background workspace changes state. Useful
# when juggling multiple agents whose sidebar badges aren't in view.
enabled = false

[worktrees]
# Sibling of the git worktrees the user already keeps under ~/. Default is
# fine; pinned explicitly so it's discoverable.
directory = "~/.herdr/worktrees"

[experimental]
# Nested herdr (herdr inside a herdr-managed pane) would be confusing —
# leave it off.
allow_nested = false
# Relay the Kitty graphics protocol through to the outer terminal so image
# previews render inside herdr panes — yazi's image previews (and any other
# kitty-graphics TUI). herdr swallows the escapes by default like tmux/zellij;
# this passes them to Ghostty, which supports the protocol. Flagged
# experimental upstream — may be rough across splits/scrollback/remote attach.
kitty_graphics = true
