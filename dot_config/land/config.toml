# How each repo lands a finished branch. Read by the `land` script
# (~/dev/skills/plugins/rjm/skills/land). Keyed by the origin's owner/name.
#
#   mode   ff    rebase onto local main, fast-forward local main, push main
#          push  rebase onto origin/main, push the tip straight to origin main
#          pr    rebase onto origin/main, push the branch, open a squash-merged PR
#   push   ff only: also push main (default true)
#   check  a command that must pass on the rebased tip
#   admin  merge PRs with --admin (land's pr mode, and pr-land), only once their checks pass
#   patience_min  ff and push: how long a land waits behind another before it stops (default 60)

[default]
mode = "ff"
push = true

# Every change lands as its own squash-merged pull request, merged at once with
# --admin: the ruleset wants a review the operator cannot give his own agents'
# work, and Operators bypass it (schools CLAUDE.md, Pull requests; the repo was schools-ts until 2026-10-20). land waits
# for the PR's checks first and refuses on a red one (operator, 2026-10-10). pr-land merges engineers' PRs the same way.
[repo."MathGaps/iac"]
# main takes a pull request (ruleset); CI applies each stack on merge.
mode = "pr"

[repo."MathGaps/schools"]
mode = "pr"
admin = true

# Land at once, check after (operator, 2026-10-22: "land really quickly and batch checks"). A land
# runs `check` on its branch alone, rebased onto main, then hands it to the queue (`batch`), which
# rebases every branch waiting onto main and fast-forwards main to them, checking nothing. abyme's
# check is scripts/gate, `scripts/check --quick` (fmt, the shapes, the specs, the typecheck the
# branch moves: about a minute). scripts/after-land, after each batch, is main's one full check: it
# promotes, runs scripts/check --full, the builds and the walk once per burst, and reverts the landing
# that turned main red; a tip that moves the live abymed promotes only once green. Before, the queue
# ran scripts/check on each batch (5-11 min, red 7 times in 11, split 28 times in a day) and lands
# waited over an hour behind each other.
[repo."Abyme-Studio/abyme"]
# No gate before a land (operator, 2026-10-22): lands go straight in; the full check and the walk
# run once a day on main instead (team daily-check).
check = ""
batch = true
after = "scripts/after-land"
patience_min = 120

# Straight to main: rebase onto local main, fast-forward, push (operator, 2026-10-21).
[repo."Abyme-Studio/bevy-ts"]
mode = "ff"
