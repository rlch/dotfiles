# `tmuxinator start Scratch` — invoked by ~/.config/tmux/scratch-toggle.sh
# on first toggle, then plain `switch-client -t scratch` thereafter.
# Window names get slugified to <=10 chars by ~/.config/tmux/slugify-title.py.
#
# Lives on the default tmux socket (no `socket_name:` here): the toggle
# is a `switch-client` against the focused client, so scratch has to be
# on the same server as whatever session you're currently attached to.
# Tmuxinator project name is the filename ("Scratch") — invoked as
# `tmuxinator start Scratch`. The `name:` here sets the tmux SESSION
# name (lowercase to match `switch-client -t scratch` in the toggle).
name: scratch
root: ~/
startup_window: Agent

windows:
  - Agent: hermes
  - Files: yazi
  - Activity: btop
  - Dotfiles:
      root: ~/dev/dotfiles
      panes:
        - claude
